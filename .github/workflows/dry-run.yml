name: CFN Dry Run

on:
  workflow_dispatch: # Manual trigger

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://templates/main.yml

      - name: Dry run create-change-set
        run: |
          aws cloudformation create-change-set \
            --stack-name demo-ec2-stack \
            --change-set-name dryrun-${{ github.run_id }} \
            --template-body file://templates/main.yml \
            --parameters \
                ParameterKey=KeyPairName,ParameterValue="my-keypair" \
                ParameterKey=InstanceType,ParameterValue="t2.micro" \
            --change-set-type CREATE
