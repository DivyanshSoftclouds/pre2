name: Deploy or Delete CloudFormation Stack

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action: deploy or delete"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - delete

jobs:
  cfn-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy or Delete Stack
        run: |
          STACK_NAME=demo-ec2-stack
          TEMPLATE_FILE=templates/main.yaml

          if [ "${{ github.event.inputs.action }}" == "deploy" ]; then
            echo "Deploying stack..."
            aws cloudformation deploy \
              --stack-name $STACK_NAME \
              --template-file $TEMPLATE_FILE \
              --capabilities CAPABILITY_NAMED_IAM \
              --region ap-south-1
          else
            echo "Deleting stack..."
            aws cloudformation delete-stack \
              --stack-name $STACK_NAME \
              --region ap-south-1
          fi
